name: site-smoke

# The rules require the demo to stay working and free until judging ends (Jan 29, 2027).
# Every day, this runs the Playwright suite in Chromium against the live site (D-53).
on:
  schedule:
    - cron: "17 14 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  smoke:
    runs-on: macos-15
    env:
      CI: "true"
      DEMO_URL: https://dormbit.vercel.app/
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter e2e exec playwright install chromium
      - name: Playwright against the live site
        run: pnpm --filter e2e exec playwright test --project=chromium
