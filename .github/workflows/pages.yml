name: pages

# Deploys the landing page and judge demo (apps/demo) to GitHub Pages (ADR-009, judge-demo
# Requirement 20). It deploys only a commit whose whole ci run passed on main, and it ships
# the exact apps/demo/dist that ci's e2e job built and tested, WebAssembly included.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deploy.outputs.page_url }}
      sha: ${{ steps.run.outputs.sha }}
    steps:
      - name: Pick the ci run to deploy
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_RUN: ${{ github.event.workflow_run.id }}
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -n "$EVENT_RUN" ]; then
            echo "id=$EVENT_RUN" >> "$GITHUB_OUTPUT"
            echo "sha=$EVENT_SHA" >> "$GITHUB_OUTPUT"
          else
            # Manual runs redeploy the latest ci run that passed on main.
            gh run list --repo "$GITHUB_REPOSITORY" --workflow ci --branch main --event push \
              --status success --limit 1 --json databaseId,headSha \
              --jq '.[0] | "id=\(.databaseId)\nsha=\(.headSha)"' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: demo-dist
          path: dist
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  smoke:
    needs: deploy
    runs-on: macos-15
    env:
      CI: "true"
      DEMO_URL: ${{ needs.deploy.outputs.page_url }}
      DEMO_SHA: ${{ needs.deploy.outputs.sha }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ needs.deploy.outputs.sha }}
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter e2e exec playwright install chromium
      - name: Playwright against the live site
        run: pnpm --filter e2e exec playwright test --project=chromium
